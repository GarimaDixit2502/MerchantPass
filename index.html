<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MerchantPass — A merchant's passport to agentic commerce</title>
  
  <!-- Google Fonts & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#432C81',
              plum: '#58315A',
              gold: '#ECBB5F',
              lavender: '#CCC3FF',
              coral: '#FF8989',
              gray: '#868686',
              bg: '#F8F7FC',
              card: '#FFFFFF',
              border: '#EAE6F5'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F8F7FC;
      color: #33274F;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F1EDFC;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CCC3FF;
      border-radius: 4px;
    }
    .pulse-dot {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(0.85); }
    }
    .hero-gradient {
      background: radial-gradient(circle at 50% 0%, #F0EBFF 0%, #F8F7FC 70%);
    }
  </style>
</head>
<body class="font-sans antialiased selection:bg-[#432C81] selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Modes: 'onboarding' vs 'console'
      const [isOnboarding, setIsOnboarding] = useState(() => {
        return localStorage.getItem('agent_passport_onboarding_done') !== 'true';
      });
      const [onboardingStep, setOnboardingStep] = useState(1); // 1: Login, 2: Catalog, 3: Policy, 4: Live Confirmation

      // Main Console Screen: 'live_orders' (Default) | 'approval_queue' | 'catalog' | 'policy' | 'channel_readiness'
      const [activeTab, setActiveTab] = useState('live_orders');
      
      // Core Data State
      const [merchantInfo, setMerchantInfo] = useState({
        merchant_name: 'Kirana Express',
        business_type: 'Grocery & FMCG Retail'
      });
      const [catalog, setCatalog] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [policy, setPolicy] = useState(null);
      const [expandedOrderEvents, setExpandedOrderEvents] = useState(new Set());
      const [isPolling, setIsPolling] = useState(true);
      const [statusToast, setStatusToast] = useState(null);
      const [actionEventId, setActionEventId] = useState(null);
      const [isResetting, setIsResetting] = useState(false);
      const [selectedProtocolFilter, setSelectedProtocolFilter] = useState('ALL');

      // Product Form Modal State
      const [showProductModal, setShowProductModal] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [productFormData, setProductFormData] = useState({
        sku: '',
        title: '',
        description: '',
        price_inr: '',
        stock_qty: '20',
        category: 'grocery',
        gtin: '8901234567890',
        is_blocked: false
      });

      // Excel/CSV Import State
      const [showImportModal, setShowImportModal] = useState(false);
      const [importPreviewData, setImportPreviewData] = useState(null);
      const [isParsingImport, setIsParsingImport] = useState(false);
      const [isConfirmingImport, setIsConfirmingImport] = useState(false);

      // Policy Form State
      const [policyFormData, setPolicyFormData] = useState({
        auto_approve_ceiling_inr: 3000,
        human_approval_ceiling_inr: 5000,
        velocity_limit: 5,
        blocked_skus: [],
        allow_all_agents: true,
        allowed_agent_list_text: 'chatgpt-shopping-agent-v1, claude-shopping-agent-v1'
      });
      const [isSavingPolicy, setIsSavingPolicy] = useState(false);

      // Channel Readiness Payload State
      const [expandedPayloadProtocol, setExpandedPayloadProtocol] = useState(null);
      const [payloadData, setPayloadData] = useState({});

      // Fetch Data Functions
      const fetchCatalog = async () => {
        try {
          const res = await fetch('/catalog');
          const data = await res.json();
          setCatalog(data);
          if (data.products && data.products.length === 0) {
            setIsOnboarding(true);
          }
        } catch (err) {
          console.error('Failed to fetch catalog:', err);
        }
      };

      const fetchAuditLogs = async () => {
        try {
          const res = await fetch('/audit?merchant_id=merchant_001');
          const data = await res.json();
          setAuditLogs(data);
        } catch (err) {
          console.error('Failed to fetch audit logs:', err);
        }
      };

      const fetchPolicy = async () => {
        try {
          const res = await fetch('/policy/merchant_001');
          const data = await res.json();
          setPolicy(data);
          setPolicyFormData({
            auto_approve_ceiling_inr: data.auto_approve_ceiling_inr,
            human_approval_ceiling_inr: data.human_approval_ceiling_inr,
            velocity_limit: data.velocity_limit || 5,
            blocked_skus: data.blocked_skus || [],
            allow_all_agents: (data.allowed_buyer_agent_ids || []).includes('*'),
            allowed_agent_list_text: (data.allowed_buyer_agent_ids || []).filter(a => a !== '*').join(', ')
          });
        } catch (err) {
          console.error('Failed to fetch policy:', err);
        }
      };

      useEffect(() => {
        fetchCatalog();
        fetchAuditLogs();
        fetchPolicy();

        const interval = setInterval(() => {
          if (isPolling && !isOnboarding) {
            fetchAuditLogs();
            fetchCatalog();
          }
        }, 3000);

        return () => clearInterval(interval);
      }, [isPolling, isOnboarding]);

      // Toggle Order Decision Trace Drawer
      const toggleOrderTrace = (eventId) => {
        setExpandedOrderEvents(prev => {
          const next = new Set(prev);
          if (next.has(eventId)) next.delete(eventId);
          else next.add(eventId);
          return next;
        });
      };

      // Handle Manual Approval for Escalated Orders
      const handleApproveOrder = async (eventId) => {
        setActionEventId(eventId);
        try {
          const res = await fetch('/audit/approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ event_id: eventId })
          });
          const result = await res.json();
          if (res.ok) {
            setStatusToast({
              title: 'Order Approved Live!',
              type: 'success',
              message: `Razorpay Order ${result.razorpay_order.id} generated for ₹${result.event.declared_total_inr}. SKU stock decremented.`
            });
            await fetchCatalog();
            await fetchAuditLogs();
          } else {
            alert(result.error || 'Approval failed');
          }
        } catch (err) {
          alert('Failed to connect to server');
        } finally {
          setActionEventId(null);
        }
      };

      // Handle Manual Rejection for Escalated Orders
      const handleRejectOrder = async (eventId) => {
        setActionEventId(eventId);
        try {
          let res = await fetch(`/approval/${eventId}/reject`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: 'Rejected by merchant administrator' })
          });

          if (!res.ok) {
            res = await fetch('/audit/reject', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ event_id: eventId, reason: 'Rejected by merchant administrator' })
            });
          }

          const result = await res.json();
          if (res.ok) {
            setStatusToast({
              title: 'Escalation Rejected',
              type: 'error',
              message: `Order ${eventId} rejected. Card removed from queue and logged in Live Orders.`
            });
            await fetchAuditLogs();
          } else {
            alert(result.error || 'Rejection failed');
          }
        } catch (err) {
          alert('Failed to connect to server');
        } finally {
          setActionEventId(null);
        }
      };

      // Reset Demo Data Handler
      const handleResetDemoData = async () => {
        if (!confirm('Reset demo data and restart Onboarding setup flow?')) return;
        setIsResetting(true);
        try {
          const res = await fetch('/reset-demo', { method: 'POST' });
          if (res.ok) {
            localStorage.removeItem('agent_passport_onboarding_done');
            setIsOnboarding(true);
            setOnboardingStep(1);
            setStatusToast({
              title: 'Demo Data Reset Complete',
              type: 'info',
              message: 'Audit logs cleared & onboarding wizard restarted.'
            });
            await fetchCatalog();
            await fetchAuditLogs();
            await fetchPolicy();
          }
        } catch (err) {
          alert('Failed to reset demo data');
        } finally {
          setIsResetting(false);
        }
      };

      // Save Policy Handler
      const handleSavePolicy = async (e) => {
        if (e) e.preventDefault();
        setIsSavingPolicy(true);
        try {
          const allowedAgents = policyFormData.allow_all_agents
            ? ['*']
            : policyFormData.allowed_agent_list_text.split(',').map(s => s.trim()).filter(Boolean);

          const res = await fetch('/policy/merchant_001', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              auto_approve_ceiling_inr: Number(policyFormData.auto_approve_ceiling_inr),
              human_approval_ceiling_inr: Number(policyFormData.human_approval_ceiling_inr),
              velocity_limit: Number(policyFormData.velocity_limit),
              blocked_skus: policyFormData.blocked_skus,
              allowed_buyer_agent_ids: allowedAgents
            })
          });

          const result = await res.json();
          if (res.ok) {
            setStatusToast({
              title: 'Policy Guardrails Saved!',
              type: 'success',
              message: 'Merchant policy guardrails updated. Takes effect immediately for next agent evaluation!'
            });
            await fetchPolicy();
            if (isOnboarding && onboardingStep === 3) {
              setOnboardingStep(4);
            }
          } else {
            alert(result.error || 'Failed to save policy');
          }
        } catch (err) {
          alert('Failed to connect to server');
        } finally {
          setIsSavingPolicy(false);
        }
      };

      // Product CRUD Handlers
      const openAddProductModal = () => {
        setEditingProduct(null);
        setProductFormData({
          sku: `SKU-${Math.floor(100 + Math.random() * 900)}`,
          title: '',
          description: '',
          price_inr: '',
          stock_qty: '20',
          category: 'grocery',
          gtin: '8901234567890',
          is_blocked: false
        });
        setShowProductModal(true);
      };

      const openEditProductModal = (product) => {
        const isBlocked = policy?.blocked_skus?.includes(product.sku) || false;
        setEditingProduct(product);
        setProductFormData({
          sku: product.sku,
          title: product.title,
          description: product.description || '',
          price_inr: String(product.price_inr),
          stock_qty: String(product.stock_qty),
          category: product.category || 'grocery',
          gtin: product.gtin || '8901234567890',
          is_blocked: isBlocked
        });
        setShowProductModal(true);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        try {
          const url = editingProduct ? `/catalog/${editingProduct.sku}` : '/catalog';
          const method = editingProduct ? 'PUT' : 'POST';

          const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(productFormData)
          });

          if (res.ok) {
            setStatusToast({
              title: editingProduct ? 'Product Updated' : 'New SKU Added',
              type: 'success',
              message: `SKU ${productFormData.sku} (${productFormData.title}) saved.`
            });
            setShowProductModal(false);
            await fetchCatalog();
            await fetchPolicy();
          } else {
            const errData = await res.json();
            alert(errData.error || 'Failed to save product');
          }
        } catch (err) {
          alert('Failed to save product');
        }
      };

      const handleDeleteProduct = async (sku) => {
        if (!confirm(`Delete SKU '${sku}' from live catalog? Historical orders will remain intact.`)) return;
        try {
          const res = await fetch(`/catalog/${sku}`, { method: 'DELETE' });
          if (res.ok) {
            setStatusToast({
              title: 'Product SKU Deleted',
              type: 'info',
              message: `SKU '${sku}' removed from catalog. Past order logs preserved.`
            });
            await fetchCatalog();
          }
        } catch (err) {
          alert('Failed to delete product SKU');
        }
      };

      // Excel / CSV File Upload Handler
      const handleFileUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setIsParsingImport(true);
        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await fetch('/catalog/import-preview', {
            method: 'POST',
            body: formData
          });

          const data = await res.json();
          if (res.ok) {
            setImportPreviewData(data);
            setShowImportModal(true);
          } else {
            alert(data.error || 'Failed to parse spreadsheet');
          }
        } catch (err) {
          console.error(err);
          alert('Failed to upload and parse file');
        } finally {
          setIsParsingImport(false);
          if (e.target) e.target.value = ''; // Reset file input so re-uploading works seamlessly
        }
      };

      const handleConfirmImport = async () => {
        if (!importPreviewData || !importPreviewData.rows) return;
        setIsConfirmingImport(true);

        const validRows = importPreviewData.rows.filter(r => r.valid);
        try {
          const res = await fetch('/catalog/import-confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: validRows })
          });

          const result = await res.json();
          if (res.ok) {
            setStatusToast({
              title: 'Catalog Import Complete!',
              type: 'success',
              message: `${result.inserted_count} SKUs added, ${result.updated_count} SKUs updated.`
            });
            setShowImportModal(false);
            setImportPreviewData(null);
            await fetchCatalog();

            if (isOnboarding && onboardingStep === 2) {
              setOnboardingStep(3);
            }
          } else {
            alert(result.error || 'Failed to complete import');
          }
        } catch (err) {
          alert('Failed to confirm import');
        } finally {
          setIsConfirmingImport(false);
        }
      };

      // Complete Onboarding & Enter Main Console
      const completeOnboardingAndEnterConsole = () => {
        localStorage.setItem('agent_passport_onboarding_done', 'true');
        setIsOnboarding(false);
        setActiveTab('live_orders');
      };

      // Fetch Technical Payload for Channel Readiness
      const togglePayloadView = async (protocol) => {
        if (expandedPayloadProtocol === protocol) {
          setExpandedPayloadProtocol(null);
          return;
        }

        setExpandedPayloadProtocol(protocol);
        if (!payloadData[protocol]) {
          try {
            let url = '';
            if (protocol === 'acp') url = '/acp/feed';
            else if (protocol === 'upi') url = '/upi/consents';
            else if (protocol === 'ap2') url = '/ap2/preview/SKU-001';
            else if (protocol === 'x402') url = '/x402/preview/SKU-001';

            const res = await fetch(url);
            const data = await res.json();
            setPayloadData(prev => ({ ...prev, [protocol]: data }));
          } catch (e) {
            setPayloadData(prev => ({ ...prev, [protocol]: { error: 'Failed to fetch payload' } }));
          }
        }
      };

      const escalatedLogs = auditLogs.filter(log => log.decision === 'escalated' || log.decision === 'pending_approval');
      const approvedCount = auditLogs.filter(log => log.decision === 'approved' || log.decision === 'paid').length;
      const escalatedCount = escalatedLogs.length;
      const rejectedCount = auditLogs.filter(log => log.decision === 'rejected').length;

      const filteredAuditLogs = auditLogs.filter(log => {
        if (selectedProtocolFilter === 'ALL') return true;
        return log.protocol === selectedProtocolFilter;
      });

      // RENDERERS FOR SHARED MODALS (EXCEL REVIEW & PRODUCT EDIT)
      const renderModals = () => (
        <React.Fragment>
          {/* EXCEL/CSV IMPORT PREVIEW MODAL */}
          {showImportModal && importPreviewData && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-4xl border border-[#CCC3FF] shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-black text-[#432C81] text-base">Spreadsheet Review & Validation</h3>
                    <p className="text-xs text-[#868686]">
                      Total Rows: {importPreviewData.total_rows} | Ready to Import: <span className="text-emerald-600 font-bold">{importPreviewData.valid_rows_count}</span> | Errors flagged: <span className="text-rose-600 font-bold">{importPreviewData.error_rows_count}</span>
                    </p>
                  </div>
                  <button onClick={() => setShowImportModal(false)} className="text-[#868686] hover:text-[#432C81] text-lg font-bold">✕</button>
                </div>

                <div className="overflow-y-auto flex-1 custom-scrollbar border border-[#CCC3FF] rounded-2xl">
                  <table className="w-full text-left text-xs font-mono">
                    <thead className="bg-[#F8F7FC] text-[#868686] font-bold sticky top-0 border-b border-slate-200">
                      <tr>
                        <th className="px-3 py-2.5">Row</th>
                        <th className="px-3 py-2.5">SKU</th>
                        <th className="px-3 py-2.5">Title</th>
                        <th className="px-3 py-2.5">Price (₹)</th>
                        <th className="px-3 py-2.5">Stock</th>
                        <th className="px-3 py-2.5">Status / Validation</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {importPreviewData.rows.map((r) => (
                        <tr key={r.row_num} className={r.valid ? 'bg-white hover:bg-[#F8F7FC]' : 'bg-[#FFF0F0]'}>
                          <td className="px-3 py-2 text-[#868686]">{r.row_num}</td>
                          <td className="px-3 py-2 font-bold text-[#432C81]">{r.sku || '-'}</td>
                          <td className="px-3 py-2 font-sans font-semibold text-slate-800">{r.title || '-'}</td>
                          <td className="px-3 py-2 text-emerald-700 font-bold">₹{r.price_inr}</td>
                          <td className="px-3 py-2 font-bold">{r.stock_qty}</td>
                          <td className="px-3 py-2">
                            {r.valid ? (
                              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold">
                                ✓ VALID (UPSERT)
                              </span>
                            ) : (
                              <span className="px-2 py-0.5 rounded bg-rose-100 text-rose-800 text-[10px] font-bold">
                                ✕ {r.errors.join(', ')}
                              </span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="flex justify-between items-center pt-3 border-t border-slate-100">
                  <span className="text-xs text-[#868686]">
                    Valid rows ({importPreviewData.valid_rows_count}) will be upserted into SQLite catalog.
                  </span>
                  <div className="space-x-2">
                    <button onClick={() => setShowImportModal(false)} className="px-4 py-2 rounded-xl bg-white text-[#868686] font-bold text-xs border">
                      Cancel
                    </button>
                    <button
                      onClick={handleConfirmImport}
                      disabled={isConfirmingImport || importPreviewData.valid_rows_count === 0}
                      className="px-4 py-2 rounded-xl bg-[#432C81] hover:bg-[#58315A] text-white font-extrabold text-xs shadow-md disabled:opacity-50"
                    >
                      {isConfirmingImport ? 'Importing...' : `Confirm Import & Proceed ➔`}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PRODUCT ADD/EDIT MODAL */}
          {showProductModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-md border border-[#CCC3FF] shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-extrabold text-[#432C81] text-base">
                    {editingProduct ? `Edit SKU (${editingProduct.sku})` : 'Add New Product SKU'}
                  </h3>
                  <button onClick={() => setShowProductModal(false)} className="text-[#868686] hover:text-[#432C81] text-lg font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-[#868686] font-bold mb-1">SKU ID</label>
                    <input
                      type="text"
                      disabled={!!editingProduct}
                      value={productFormData.sku}
                      onChange={(e) => setProductFormData({ ...productFormData, sku: e.target.value })}
                      required
                      className="w-full bg-[#F8F7FC] border border-[#CCC3FF] rounded-xl px-3 py-2 text-[#432C81] font-mono font-bold disabled:opacity-50"
                    />
                  </div>

                  <div>
                    <label className="block text-[#868686] font-bold mb-1">Product Title</label>
                    <input
                      type="text"
                      value={productFormData.title}
                      onChange={(e) => setProductFormData({ ...productFormData, title: e.target.value })}
                      required
                      placeholder="e.g. Organic Brown Rice 5kg"
                      className="w-full bg-[#F8F7FC] border border-[#CCC3FF] rounded-xl px-3 py-2 text-slate-800 font-semibold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[#868686] font-bold mb-1">Price (₹ INR)</label>
                      <input
                        type="number"
                        value={productFormData.price_inr}
                        onChange={(e) => setProductFormData({ ...productFormData, price_inr: e.target.value })}
                        required
                        placeholder="899"
                        className="w-full bg-[#F8F7FC] border border-[#CCC3FF] rounded-xl px-3 py-2 text-[#432C81] font-mono font-bold"
                      />
                    </div>

                    <div>
                      <label className="block text-[#868686] font-bold mb-1">Live Stock Qty</label>
                      <input
                        type="number"
                        value={productFormData.stock_qty}
                        onChange={(e) => setProductFormData({ ...productFormData, stock_qty: e.target.value })}
                        required
                        placeholder="20"
                        className="w-full bg-[#F8F7FC] border border-[#CCC3FF] rounded-xl px-3 py-2 text-slate-800 font-mono font-bold"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[#868686] font-bold mb-1">Category</label>
                    <select
                      value={productFormData.category}
                      onChange={(e) => setProductFormData({ ...productFormData, category: e.target.value })}
                      className="w-full bg-[#F8F7FC] border border-[#CCC3FF] rounded-xl px-3 py-2 text-slate-800 font-semibold"
                    >
                      <option value="grocery">Grocery</option>
                      <option value="beverages">Beverages</option>
                      <option value="staples">Staples</option>

                          const isBlocked = policy?.blocked_skus?.includes(p.sku);

                          return (
                            <tr key={p.sku} className="hover:bg-[#F8F7FC] transition">
                              <td className="px-4 py-3.5 font-bold text-[#432C81]">
                                {p.sku}
                                {isBlocked && (
                                  <span className="ml-2 px-1.5 py-0.5 rounded text-[9px] font-bold bg-[#FF8989]/20 text-rose-800 border border-[#FF8989]">
                                    BLOCKED
                                  </span>
                                )}
                              </td>
                              <td className="px-4 py-3.5 font-sans font-bold text-slate-800">{p.title}</td>
                              <td className="px-4 py-3.5">
                                <span className="px-2 py-0.5 rounded-full bg-[#F0EDFF] text-[#432C81] text-[10px] font-bold">
                                  {p.category}
                                </span>
                              </td>
                              <td className="px-4 py-3.5 font-extrabold text-[#432C81]">₹{p.price_inr}</td>
                              <td className="px-4 py-3.5 font-bold">
                                {p.stock_qty > 0 ? (
                                  <span className="text-emerald-700">{p.stock_qty} units</span>
                                ) : (
                                  <span className="text-[#FF8989] font-black">OUT OF STOCK</span>
                                )}
                              </td>
                              <td className="px-4 py-3.5 text-[#868686]">{p.gtin}</td>
                              <td className="px-4 py-3.5 text-right space-x-2">
                                <button
                                  onClick={() => openEditProductModal(p)}
                                  className="px-2.5 py-1 rounded-lg bg-white border border-[#CCC3FF] hover:bg-[#F0EDFF] text-[#432C81] text-[11px] font-sans font-bold"
                                >
                                  Edit
                                </button>
                                <button
                                  onClick={() => handleDeleteProduct(p.sku)}
                                  className="px-2.5 py-1 rounded-lg bg-[#FFF0F0] hover:bg-rose-100 text-rose-700 text-[11px] font-sans font-bold border border-[#FF8989]"
                                >
                                  Delete
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* SECTION 4: POLICY SETTINGS */}
              {activeTab === 'policy' && (
                <div className="bg-white rounded-2xl p-6 border border-[#CCC3FF]/60 shadow-sm space-y-6">
                  <div className="border-b border-slate-100 pb-4">
                    <h2 className="font-extrabold text-[#432C81] text-lg flex items-center space-x-2">
                      <span>🛡️</span>
                      <span>Merchant Policy Guardrails Settings</span>
                    </h2>
                    <p className="text-xs text-[#868686] mt-0.5">
                      Configure live ceilings, velocity caps, blocked SKUs, and buyer agent allow-lists. Updates take effect immediately!
                    </p>
                  </div>

                  <form onSubmit={handleSavePolicy} className="space-y-6 text-xs">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="p-4 rounded-2xl bg-[#F8F7FC] border border-[#CCC3FF] space-y-2">
                        <label className="block text-[#432C81] font-bold">Auto-Approve Ceiling (₹ INR)</label>
                        <p className="text-[11px] text-[#868686]">Orders under this amount are approved instantly, no human needed.</p>
                        <input
                          type="number"
                          value={policyFormData.auto_approve_ceiling_inr}
                          onChange={(e) => setPolicyFormData({ ...policyFormData, auto_approve_ceiling_inr: e.target.value })}
                          required
                          className="w-full bg-white border border-[#CCC3FF] rounded-xl px-3 py-2 text-[#432C81] font-bold text-base font-mono"
                        />
                      </div>

                      <div className="p-4 rounded-2xl bg-[#F8F7FC] border border-[#CCC3FF] space-y-2">
                        <label className="block text-[#432C81] font-bold">Human Approval Ceiling (₹ INR)</label>
                        <p className="text-[11px] text-[#868686]">Orders above this go to your Approval Queue instead of being rejected outright.</p>
                        <input
                          type="number"
                          value={policyFormData.human_approval_ceiling_inr}
                          onChange={(e) => setPolicyFormData({ ...policyFormData, human_approval_ceiling_inr: e.target.value })}
                          required
                          className="w-full bg-white border border-[#CCC3FF] rounded-xl px-3 py-2 text-[#58315A] font-bold text-base font-mono"
                        />
                      </div>

                      <div className="p-4 rounded-2xl bg-[#F8F7FC] border border-[#CCC3FF] space-y-2">
                        <label className="block text-[#432C81] font-bold">Hourly Velocity Limit</label>
                        <p className="text-[11px] text-[#868686]">Max allowed orders per agent per hour before triggering velocity block.</p>
                        <input
                          type="number"
                          value={policyFormData.velocity_limit}
                          onChange={(e) => setPolicyFormData({ ...policyFormData, velocity_limit: e.target.value })}
                          required
                          className="w-full bg-white border border-[#CCC3FF] rounded-xl px-3 py-2 text-[#432C81] font-bold text-base font-mono"
                        />
                      </div>
                    </div>

                    {/* Blocked SKUs Selector */}
                    <div className="p-4 rounded-2xl bg-[#F8F7FC] border border-[#CCC3FF] space-y-3">
                      <label className="block text-[#432C81] font-bold text-sm">Blocked Catalog SKUs for AI Buyer-Agents</label>
                      <p className="text-xs text-[#868686]">Select SKUs that AI buyer agents are explicitly forbidden from purchasing.</p>

                      {catalog && catalog.products && (
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 pt-1">
                          {catalog.products.map(p => {
                            const isBlocked = policyFormData.blocked_skus.includes(p.sku);
                            return (
                              <label
                                key={p.sku}
                                className={`p-3 rounded-xl border text-xs cursor-pointer flex items-center justify-between transition ${
                                  isBlocked ? 'bg-[#FFF0F0] border-[#FF8989] text-rose-900' : 'bg-white border-[#CCC3FF] text-[#432C81]'
                                }`}
                              >
                                <div>
                                  <span className="font-mono font-bold block">{p.sku}</span>
                                  <span className="text-[10px] text-[#868686] truncate block max-w-[120px]">{p.title}</span>
                                </div>
                                <input
                                  type="checkbox"
                                  checked={isBlocked}
                                  onChange={(e) => {
                                    if (e.target.checked) {
                                      setPolicyFormData({ ...policyFormData, blocked_skus: [...policyFormData.blocked_skus, p.sku] });
                                    } else {
                                      setPolicyFormData({ ...policyFormData, blocked_skus: policyFormData.blocked_skus.filter(s => s !== p.sku) });
                                    }
                                  }}
                                />
                              </label>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    {/* Allowed Buyer Agent IDs */}
                    <div className="p-4 rounded-2xl bg-[#F8F7FC] border border-[#CCC3FF] space-y-3">
                      <div className="flex justify-between items-center">
                        <label className="block text-[#432C81] font-bold text-sm">Allowed Buyer Agent Identity Allow-list</label>
                        <label className="flex items-center space-x-2 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={policyFormData.allow_all_agents}
                            onChange={(e) => setPolicyFormData({ ...policyFormData, allow_all_agents: e.target.checked })}
                            className="rounded border-[#CCC3FF]"
                          />
                          <span className="text-xs font-bold text-[#432C81]">Allow All Verified Agents (*)</span>
                        </label>
                      </div>

                      {!policyFormData.allow_all_agents && (
                        <div>
                          <label className="block text-[#868686] mb-1">Specific Buyer Agent IDs (comma separated)</label>
                          <input
                            type="text"
                            value={policyFormData.allowed_agent_list_text}
                            onChange={(e) => setPolicyFormData({ ...policyFormData, allowed_agent_list_text: e.target.value })}
                            placeholder="chatgpt-shopping-agent-v1, claude-shopping-agent-v1"
                            className="w-full bg-white border border-[#CCC3FF] rounded-xl px-3 py-2 text-[#432C81] font-mono"
                          />
                        </div>
                      )}
                    </div>

                    <div className="flex justify-end pt-2">
                      <button
                        type="submit"
                        disabled={isSavingPolicy}
                        className="px-6 py-3 rounded-xl bg-[#432C81] hover:bg-[#58315A] text-white font-extrabold text-xs shadow-md transition flex items-center space-x-2"
                      >
                        <span>💾</span>
                        <span>{isSavingPolicy ? 'Saving...' : 'Save Policy Settings'}</span>
                      </button>
                    </div>
                  </form>
                </div>
              )}

              {/* SECTION 5: AGENT CHANNEL READINESS */}
              {activeTab === 'channel_readiness' && (
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl p-5 border border-[#CCC3FF]/60 shadow-sm">
                    <h2 className="font-extrabold text-[#432C81] text-base">Agent Channel Protocol Readiness</h2>
                    <p className="text-xs text-[#868686] mt-0.5">
                      Multi-protocol adapter readiness overview for AI buyer-agents querying this catalog.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* Channel 1: ACP */}
                    <div className="bg-white rounded-2xl p-5 border border-[#CCC3FF] shadow-sm space-y-4">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-emerald-100 text-emerald-800 border border-emerald-300">
                            ✓ LIVE
                          </span>
                          <h3 className="font-extrabold text-[#432C81] text-base mt-2">ACP (Agentic Commerce Protocol)</h3>
                          <p className="text-xs text-[#868686]">OpenAI + Stripe delegated agent catalog & checkout protocol standard.</p>
                        </div>
                      </div>
                      <button
                        onClick={() => togglePayloadView('acp')}
                        className="text-xs px-3 py-1.5 rounded-xl bg-[#F0EDFF] text-[#432C81] font-mono font-bold"
                      >
                        {expandedPayloadProtocol === 'acp' ? 'Hide technical payload ▲' : 'View technical payload ▼'}
                      </button>
                      {expandedPayloadProtocol === 'acp' && (
                        <pre className="p-3 rounded-xl bg-[#F8F7FC] border border-[#CCC3FF] font-mono text-[11px] text-[#432C81] overflow-x-auto custom-scrollbar max-h-64">
                          {JSON.stringify(payloadData['acp'] || 'Loading...', null, 2)}
                        </pre>
                      )}
                    </div>

                    {/* Channel 2: UPI-Native */}
                    <div className="bg-white rounded-2xl p-5 border border-[#CCC3FF] shadow-sm space-y-4">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-emerald-100 text-emerald-800 border border-emerald-300">
                            ✓ LIVE
                          </span>
                          <h3 className="font-extrabold text-[#432C81] text-base mt-2">UPI-Native Consent Purchases</h3>
                          <p className="text-xs text-[#868686]">NPCI + Razorpay UPI Circle delegated consent registration pattern.</p>
                        </div>
                      </div>
                      <button
                        onClick={() => togglePayloadView('upi')}
                        className="text-xs px-3 py-1.5 rounded-xl bg-[#F0EDFF] text-[#432C81] font-mono font-bold"
                      >
                        {expandedPayloadProtocol === 'upi' ? 'Hide technical payload ▲' : 'View technical payload ▼'}
                      </button>
                      {expandedPayloadProtocol === 'upi' && (
                        <pre className="p-3 rounded-xl bg-[#F8F7FC] border border-[#CCC3FF] font-mono text-[11px] text-[#432C81] overflow-x-auto custom-scrollbar max-h-64">
                          {JSON.stringify(payloadData['upi'] || 'Loading...', null, 2)}
                        </pre>
                      )}
                    </div>

                    {/* Channel 3: AP2 */}
                    <div className="bg-white rounded-2xl p-5 border border-[#CCC3FF] shadow-sm space-y-4">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-[#FFF8E7] text-[#58315A] border border-[#ECBB5F]">
                            Preview — catalog-ready
                          </span>
                          <h3 className="font-extrabold text-[#432C81] text-base mt-2">AP2 (Agent Payment Protocol)</h3>
                          <p className="text-xs text-[#868686]">Google / FIDO W3C verifiable mandate chain specification.</p>
                        </div>
                      </div>
                      <button
                        onClick={() => togglePayloadView('ap2')}
                        className="text-xs px-3 py-1.5 rounded-xl bg-[#F0EDFF] text-[#432C81] font-mono font-bold"
                      >
                        {expandedPayloadProtocol === 'ap2' ? 'Hide technical payload ▲' : 'View technical payload ▼'}
                      </button>
                      {expandedPayloadProtocol === 'ap2' && (
                        <pre className="p-3 rounded-xl bg-[#F8F7FC] border border-[#CCC3FF] font-mono text-[11px] text-[#432C81] overflow-x-auto custom-scrollbar max-h-64">
                          {JSON.stringify(payloadData['ap2'] || 'Loading...', null, 2)}
                        </pre>
                      )}
                    </div>

                    {/* Channel 4: x402 */}
                    <div className="bg-white rounded-2xl p-5 border border-[#CCC3FF] shadow-sm space-y-4">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-[#FFF8E7] text-[#58315A] border border-[#ECBB5F]">
                            Preview — catalog-ready
                          </span>
                          <h3 className="font-extrabold text-[#432C81] text-base mt-2">x402 (HTTP 402 Payment Required)</h3>
                          <p className="text-xs text-[#868686]">Coinbase + Cloudflare HTTP 402 header payment standard.</p>
                        </div>
                      </div>
                      <button
                        onClick={() => togglePayloadView('x402')}
                        className="text-xs px-3 py-1.5 rounded-xl bg-[#F0EDFF] text-[#432C81] font-mono font-bold"
                      >
                        {expandedPayloadProtocol === 'x402' ? 'Hide technical payload ▲' : 'View technical payload ▼'}
                      </button>
                      {expandedPayloadProtocol === 'x402' && (
                        <pre className="p-3 rounded-xl bg-[#F8F7FC] border border-[#CCC3FF] font-mono text-[11px] text-[#432C81] overflow-x-auto custom-scrollbar max-h-64">
                          {JSON.stringify(payloadData['x402'] || 'Loading...', null, 2)}
                        </pre>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {renderModals()}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
